[project]
name = "hackneft-ai"
version = "0.1.0"
description = "ИИ-сервис: управление и запуск агентов"
requires-python = ">=3.12"
dependencies = [
    "hackneft-common",
]

[tool.uv.sources]
hackneft-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackneft_ai"]
