[project]
name = "hackneft-ai"
version = "0.1.0"
description = "ИИ-сервис: управление и запуск агентов"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22",
    "fastapi>=0.141",
    "hackneft-common",
    "httpx2>=2.13",
    "mcp>=2.2",
    "openai>=3.15",
    "opentelemetry-api>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-sdk>=1.44",
    "pyjwt[crypto]>=2.14",
    "python-dotenv>=1.2",
    "sqlalchemy[asyncio]>=2.0.54",
    "sse-starlette>=3.4",
    "uvicorn>=0.53",
]

[project.scripts]
hackneft-ai = "hackneft_ai.__main__:main"

[tool.uv.sources]
hackneft-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackneft_ai"]
