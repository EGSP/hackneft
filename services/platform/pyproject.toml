[project]
name = "hackneft-platform"
version = "0.1.0"
description = "Платформа: база данных, пользовательский интерфейс, обработка событий"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "hackneft-common",
    "httpx>=0.27",
    "python-dotenv>=1.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
hackneft-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackneft_platform"]
