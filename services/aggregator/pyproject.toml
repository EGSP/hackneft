[project]
name = "hackneft-aggregator"
version = "0.1.0"
description = "Агрегатор: сбор и преобразование данных датчиков и внешних источников"
requires-python = ">=3.12"
dependencies = [
    "hackneft-common",
]

[tool.uv.sources]
hackneft-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackneft_aggregator"]
