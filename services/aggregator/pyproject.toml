[project]
name = "hackneft-aggregator"
version = "0.1.0"
description = "Агрегатор: сбор и преобразование данных датчиков и внешних источников"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "hackneft-common",
    "httpx>=0.27",
    "python-dotenv>=1.2",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
hackneft-aggregator = "hackneft_aggregator.__main__:main"

[tool.uv.sources]
hackneft-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackneft_aggregator"]
