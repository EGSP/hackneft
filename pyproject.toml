[project]
name = "hackneft"
version = "0.0.0"
description = "Монорепозиторий проекта Нефтекод"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["services/*", "libs/*"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["libs/common/src", "services/aggregator/src", "services/platform/src", "services/ai/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["libs", "services"]
